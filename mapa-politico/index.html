<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mapa Político de Portugal: programas eleitorais, dirigentes e afinidades entre os partidos com assento parlamentar.">
  <title>Mapa Político de Portugal</title>

  <!-- Fase 4: biblioteca do grafo (Vis.js), com versão fixa para o grafo não mudar sozinho -->
  <script type="text/javascript" src="https://unpkg.com/vis-network@10.1.2/standalone/umd/vis-network.min.js"></script>

  <style>
    /* =========================================================
       1. TOKENS DE DESIGN
       ========================================================= */
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-2: #f0f2f5;
      --border: #e2e5ea;
      --text: #1b1f24;
      --text-muted: #5b6573;
      --accent: #2952e3;
      --accent-soft: #e8edfd;
      --focus: #2952e3;
      --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 4px 12px rgba(16, 24, 40, .06);

      --radius-sm: 6px;
      --radius: 10px;
      --radius-lg: 16px;

      --sidebar-w: 288px;
      --header-h: 60px;

      --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --fs-xs: .75rem;
      --fs-sm: .875rem;
      --fs-md: 1rem;
      --fs-lg: 1.25rem;
      --fs-xl: 1.625rem;

      --ease: cubic-bezier(.2, .7, .2, 1);

      --graph-bg: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1216;
        --surface: #171b21;
        --surface-2: #1f242c;
        --border: #2b313a;
        --text: #e7eaee;
        --text-muted: #9aa4b2;
        --accent: #7c9cff;
        --accent-soft: #222c4a;
        --focus: #7c9cff;
        --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 12px rgba(0, 0, 0, .3);
        --graph-bg: #1a2029;
      }
    }

    /* =========================================================
       2. BASE
       ========================================================= */
    *, *::before, *::after { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: var(--font);
      font-size: var(--fs-md);
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4 { margin: 0; line-height: 1.25; }
    p { margin: 0; }
    ul { margin: 0; padding: 0; list-style: none; }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer;
    }

    :focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .visually-hidden {
      position: absolute !important;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* =========================================================
       3. LAYOUT (mobile-first)
       Telemóvel: cabeçalho + conteúdo; o painel de partidos abre
       como gaveta lateral. A partir de 768px: grelha de 2 colunas.
       ========================================================= */
    .app {
      display: grid;
      grid-template-rows: var(--header-h) 1fr;
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas:
        "header"
        "main";
      height: 100%;
    }

    /* ---------- Cabeçalho ---------- */
    .app-header {
      grid-area: header;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .app-title {
      min-width: 0;
      font-size: var(--fs-md);
      font-weight: 700;
      letter-spacing: -.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .icon-btn {
      display: inline-grid;
      place-items: center;
      width: 40px; height: 40px;
      border-radius: var(--radius-sm);
      flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--surface-2); }
    .icon-btn svg { width: 22px; height: 22px; }

    .view-switch {
      margin-left: auto;
      display: inline-flex;
      padding: 3px;
      gap: 2px;
      background: var(--surface-2);
      border-radius: 999px;
      flex-shrink: 0;
    }
    .view-switch button {
      padding: 6px 12px;
      font-size: var(--fs-sm);
      font-weight: 600;
      color: var(--text-muted);
      border-radius: 999px;
      transition: background .15s var(--ease), color .15s var(--ease);
    }
    .view-switch button[aria-pressed="true"] {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow);
    }

    /* ---------- Painel lateral (partidos) ---------- */
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: min(86vw, var(--sidebar-w));
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-right: 1px solid var(--border);
      transform: translateX(-100%);
      transition: transform .25s var(--ease);
      z-index: 50;
    }
    .sidebar.is-open { transform: translateX(0); box-shadow: var(--shadow); }

    .sidebar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: var(--header-h);
      padding: 0 12px 0 16px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-head h2 {
      font-size: var(--fs-sm);
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-muted);
    }

    .sidebar-search { padding: 12px 16px; }
    .sidebar-search input {
      width: 100%;
      padding: 9px 12px;
      font: inherit;
      font-size: var(--fs-sm);
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
    }
    .sidebar-search input:focus { border-color: var(--accent); outline: none; }

    .party-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px 16px;
    }

    .party-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 10px 8px;
      text-align: left;
      border-radius: var(--radius);
      transition: background .15s var(--ease);
    }
    .party-item:hover { background: var(--surface-2); }
    .party-item[aria-current="true"] { background: var(--accent-soft); }

    .party-logo {
      display: inline-grid;
      place-items: center;
      width: 40px; height: 40px;
      flex-shrink: 0;
      border-radius: var(--radius-sm);
      font-size: var(--fs-xs);
      font-weight: 800;
      color: #fff;
      background: var(--party-color, var(--text-muted));
    }

    .party-meta { min-width: 0; }
    .party-meta strong { display: block; font-size: var(--fs-sm); }
    .party-meta span {
      display: block;
      font-size: var(--fs-xs);
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(10, 12, 16, .45);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s var(--ease);
      z-index: 40;
    }
    .backdrop.is-visible { opacity: 1; pointer-events: auto; }

    /* ---------- Conteúdo principal ---------- */
    .main {
      grid-area: main;
      overflow-y: auto;
      padding: 20px 16px 48px;
    }
    .main-inner { max-width: 960px; margin: 0 auto; }

    /* Estado vazio / boas-vindas */
    .empty-state {
      display: grid;
      gap: 12px;
      justify-items: center;
      text-align: center;
      padding: 48px 16px;
      color: var(--text-muted);
    }
    .empty-state h2 { color: var(--text); font-size: var(--fs-lg); }
    .empty-state p { max-width: 46ch; }

    /* Cabeçalho do partido */
    .party-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .party-header .party-logo { width: 56px; height: 56px; font-size: var(--fs-sm); }
    .party-header h2 { font-size: var(--fs-xl); letter-spacing: -.02em; }
    .party-header p { color: var(--text-muted); font-size: var(--fs-sm); }

    /* ---------- Abas ---------- */
    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
      overflow-x: auto;
    }
    .tab {
      padding: 10px 14px;
      font-size: var(--fs-sm);
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      white-space: nowrap;
    }
    .tab:hover { color: var(--text); }
    .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

    .tab-panel[hidden] { display: none; }

    /* ---------- Filtro de categorias ---------- */
    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      scrollbar-width: thin;
    }
    .chip {
      flex-shrink: 0;
      padding: 6px 12px;
      font-size: var(--fs-xs);
      font-weight: 600;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
    }
    .chip[aria-pressed="true"] {
      color: var(--accent);
      background: var(--accent-soft);
      border-color: transparent;
    }

    /* ---------- Categorias do programa (acordeão) ---------- */
    .category-list { display: grid; gap: 12px; }

    .category {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .category > summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      font-weight: 600;
      cursor: pointer;
      list-style: none;
    }
    .category > summary::-webkit-details-marker { display: none; }
    .category > summary::after {
      content: "";
      width: 8px; height: 8px;
      border-right: 2px solid var(--text-muted);
      border-bottom: 2px solid var(--text-muted);
      transform: rotate(45deg);
      transition: transform .2s var(--ease);
      flex-shrink: 0;
    }
    .category[open] > summary::after { transform: rotate(-135deg); }

    .category-count {
      margin-left: auto;
      font-size: var(--fs-xs);
      font-weight: 600;
      color: var(--text-muted);
    }

    .topic-list {
      display: grid;
      gap: 2px;
      padding: 0 16px 14px;
    }
    .topic {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px 10px;
      padding: 10px 0;
      border-top: 1px solid var(--border);
      font-size: var(--fs-sm);
    }
    .topic-text { flex: 1 1 260px; }

    /* Badges de convergência (preenchidos na Fase 3) */
    .badges { display: inline-flex; flex-wrap: wrap; gap: 4px; }
    .badge {
      padding: 1px 7px;
      font-size: 11px;
      font-weight: 700;
      line-height: 18px;
      color: var(--badge-text, #fff);
      background: var(--party-color, var(--text-muted));
      border-radius: 4px;
      cursor: pointer;
    }
    .badge:hover { filter: brightness(1.1); }

    /* Tópico de destino ao chegar por um badge */
    .topic.is-highlight { animation: topic-flash 2s ease-out; }
    @keyframes topic-flash {
      from { background: var(--accent-soft); }
      to { background: transparent; }
    }
    @media (prefers-reduced-motion: reduce) {
      .topic.is-highlight { animation: none; background: var(--accent-soft); }
    }

    .source-note {
      margin-bottom: 12px;
      font-size: var(--fs-xs);
      color: var(--text-muted);
    }

    .placeholder.category-empty { padding: 0 16px 14px; }

    .placeholder {
      padding: 12px 0 2px;
      font-size: var(--fs-sm);
      color: var(--text-muted);
      font-style: italic;
    }

    /* ---------- Quem é Quem ---------- */
    .people-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .person-card {
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .person-card h3 { font-size: var(--fs-md); }
    .person-role { font-size: var(--fs-sm); color: var(--accent); font-weight: 600; margin-top: 2px; }
    .person-fields { display: grid; gap: 8px; margin: 12px 0 0; }
    .person-fields dt {
      font-size: var(--fs-xs);
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--text-muted);
    }
    .person-fields dd { margin: 0; font-size: var(--fs-sm); }

    /* ---------- Vista do grafo (Fase 4) ---------- */
    .graph-view h2 { font-size: var(--fs-xl); margin-bottom: 6px; }
    .graph-view > p { color: var(--text-muted); font-size: var(--fs-sm); margin-bottom: 16px; }
    .graph-canvas {
      position: relative;
      height: min(70vh, 640px);
      min-height: 360px;
      background: var(--graph-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .graph-canvas .empty-state { position: absolute; inset: 0; align-content: center; }
    .graph-legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 16px;
      margin-bottom: 12px;
      font-size: var(--fs-sm);
      color: var(--text-muted);
    }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; }
    .legend-mark { display: inline-block; flex: none; }
    .legend-mark.is-party { width: 22px; height: 14px; border-radius: 4px; background: linear-gradient(90deg, #f68a1e, #e5197e, #7ab51d, #00a3e0); }
    .legend-mark.is-category { width: 20px; height: 13px; border-radius: 50%; background: #eef1f5; border: 1px solid #a3abb7; }
    .legend-mark.is-idea { width: 8px; height: 8px; border-radius: 50%; background: #6b98f0; border: 0.5px solid #4a7bd8; }
    @media (prefers-color-scheme: dark) {
      .legend-mark.is-category { background: #2a323e; border-color: #4b5563; }
    }
    .legend-mark.is-shared { width: 12px; height: 12px; border-radius: 50%; background: #2fb488; border: 0.5px solid #1c8a66; }
    .graph-loading {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-content: center;
      gap: 10px;
      text-align: center;
      font-size: var(--fs-sm);
      color: var(--text-muted);
      background: var(--surface);
    }
    .graph-loading progress { width: 180px; accent-color: var(--accent); }
    /* Tooltips do Vis.js (mais específico que o CSS que a biblioteca injeta) */
    .graph-canvas div.vis-tooltip {
      max-width: 320px;
      padding: 8px 10px;
      font-family: var(--font);
      font-size: var(--fs-sm);
      line-height: 1.45;
      color: var(--text);
      white-space: normal;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
    }

    /* =========================================================
       4. BREAKPOINTS
       ========================================================= */
    .title-extra { display: none; }

    @media (min-width: 480px) {
      .title-extra { display: inline; }
    }

    @media (min-width: 560px) {
      .people-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (min-width: 768px) {
      .app {
        grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
        grid-template-areas:
          "header header"
          "sidebar main";
      }
      .app-header .menu-btn,
      .sidebar .close-btn { display: none; }

      .sidebar {
        grid-area: sidebar;
        position: static;
        width: auto;
        transform: none;
        transition: none;
        box-shadow: none;
        min-height: 0;
      }
      .sidebar-head { height: auto; padding: 16px 16px 4px; border-bottom: 0; }
      .backdrop { display: none; }

      .main { padding: 32px 32px 64px; }
      .chips { flex-wrap: wrap; overflow-x: visible; }
      .app-title { font-size: var(--fs-lg); }
    }

    @media (min-width: 1100px) {
      .people-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- ================= CABEÇALHO ================= -->
    <header class="app-header">
      <button class="icon-btn menu-btn" type="button" aria-label="Abrir lista de partidos" aria-controls="sidebar" aria-expanded="false" data-action="open-sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h1 class="app-title">Mapa Político<span class="title-extra"> de Portugal</span></h1>
      <nav class="view-switch" aria-label="Vista">
        <button type="button" data-view="partidos" aria-pressed="true">Partidos</button>
        <button type="button" data-view="grafo" aria-pressed="false">Grafo</button>
      </nav>
    </header>

    <!-- ================= PAINEL DE PARTIDOS ================= -->
    <aside class="sidebar" id="sidebar" aria-label="Partidos">
      <div class="sidebar-head">
        <h2>Partidos</h2>
        <button class="icon-btn close-btn" type="button" aria-label="Fechar lista de partidos" data-action="close-sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="sidebar-search">
        <label for="party-search" class="visually-hidden">Pesquisar partido</label>
        <input id="party-search" type="search" placeholder="Pesquisar partido…" autocomplete="off">
      </div>
      <ul class="party-list" id="party-list"><!-- gerado pelo JS --></ul>
    </aside>
    <div class="backdrop" data-action="close-sidebar"></div>

    <!-- ================= CONTEÚDO ================= -->
    <main class="main" id="main">
      <div class="main-inner" id="view"><!-- gerado pelo JS --></div>
    </main>
  </div>

  <script>
    'use strict';

    /* =========================================================
       1. DADOS
       ========================================================= */

    const UNAVAILABLE = 'Informação não disponível';

    /** As 15 categorias obrigatórias, pela ordem definida no projeto. */
    const CATEGORIES = [
      { id: 'economia',      nome: 'Economia e Finanças' },
      { id: 'impostos',      nome: 'Impostos e Fiscalidade' },
      { id: 'juventude',     nome: 'Juventude' },
      { id: 'educacao',      nome: 'Educação' },
      { id: 'habitacao',     nome: 'Habitação' },
      { id: 'saude',         nome: 'Saúde' },
      { id: 'imigracao',     nome: 'Imigração e Integração' },
      { id: 'seguranca',     nome: 'Segurança e Justiça' },
      { id: 'trabalho',      nome: 'Trabalho e Emprego' },
      { id: 'ambiente',      nome: 'Ambiente e Energia' },
      { id: 'estado-social', nome: 'Estado Social e Pensões' },
      { id: 'cultura',       nome: 'Cultura' },
      { id: 'agricultura',   nome: 'Agricultura e Pescas' },
      { id: 'coesao',        nome: 'Coesão Territorial e Autonomias' },
      { id: 'transparencia', nome: 'Transparência e Combate à Corrupção' },
    ];

    /**
     * Partidos com assento parlamentar.
     * Fase 2: preenchidos por grupos (1.º AD, PS e Chega; 2.º IL, Livre e CDU; 3.º BE, PAN e JPP).
     *
     * Formato:
     *   fonte:      documento de onde vêm as propostas
     *   programa:   { [categoryId]: [ { texto: string, ideia: string|null } ] }
     *               `ideia` é um identificador kebab-case partilhado entre partidos com
     *               propostas semelhantes (ex.: 'iva-zero-cabaz'); a Fase 3 cruza-o para
     *               gerar os badges. Categoria vazia = sem informação verificada.
     *   dirigentes: [ { nome, funcao, area, militancia, passado } ]
     *               Campos desconhecidos: 'Informação não disponível'.
     */
    const PARTIES = [
      {
        id: 'ad', sigla: 'AD', nome: 'Aliança Democrática (PSD + CDS-PP)', cor: '#f68a21',
        fonte: 'Programa Eleitoral AD, Legislativas 2025',
        programa: {
          economia: [
            { texto: 'Manter saldos orçamentais ligeiramente positivos e reduzir o peso da dívida pública.', ideia: 'contas-publicas-equilibradas' },
            { texto: 'Reforçar os apoios às exportações face às tensões comerciais internacionais.', ideia: 'apoio-exportacoes' },
            { texto: 'Garantir que o Estado paga aos fornecedores em 30 dias e decide dentro dos prazos legais.', ideia: 'estado-paga-a-tempo' },
            { texto: 'Cortar burocracia: simplificar licenciamentos, contratação pública e taxas administrativas.', ideia: 'desburocratizar-estado' },
          ],
          impostos: [
            { texto: 'Reduzir o IRS em 2.000 milhões de euros, sobretudo para a classe média.', ideia: 'reduzir-irs-classe-media' },
            { texto: 'Baixar gradualmente o IRC até 17% (15% para as PME).', ideia: 'reduzir-irc' },
            { texto: 'Simplificação fiscal e aceleração da justiça tributária.', ideia: 'simplificacao-fiscal' },
          ],
          juventude: [
            { texto: 'Manter o IRS Jovem reduzido.', ideia: 'irs-jovem' },
            { texto: 'Isenção de IMT e Imposto do Selo na compra da primeira casa pelos jovens.', ideia: 'isencao-imt-jovens' },
            { texto: 'Garantia pública no crédito à compra da primeira casa.', ideia: 'garantia-publica-primeira-casa' },
          ],
          educacao: [

            area: 'Direção nacional do partido',
            militancia: UNAVAILABLE,
            passado: 'Eleita presidente do JPP no V Congresso Nacional, em janeiro de 2024, com mais de 96% dos votos, sucedendo a Filipe Sousa. Discursou como presidente no VI Congresso, em janeiro de 2025.',
          },
        ],
      },
    ];

    /* =========================================================
       2. ESTADO E ROTAS
       Rotas por hash, para permitir links diretos:
         #/                         → boas-vindas
         #/partido/<id>/programa    → aba Programa
         #/partido/<id>/quem        → aba Quem é Quem
         #/grafo                    → grafo de afinidades
       ========================================================= */
    const state = {
      view: 'partidos',      // 'partidos' | 'grafo'
      partyId: null,
      tab: 'programa',       // 'programa' | 'quem'
      category: 'todas',     // filtro de categoria na aba Programa
      search: '',
    };

    function parseHash() {
      const [, section, id, tab] = location.hash.replace(/^#/, '').split('/');
      if (section === 'grafo') return { view: 'grafo' };
      if (section === 'partido' && getParty(id)) {
        return { view: 'partidos', partyId: id, tab: tab === 'quem' ? 'quem' : 'programa' };
      }
      return { view: 'partidos', partyId: null, tab: 'programa' };
    }

    function navigate(hash) {
      if (location.hash !== hash) {
        // Usar location.hash em vez de history.pushState para compatibilidade com iframes srcdoc do Claude
        location.hash = hash;
      } else {
        // Se o hash já for o mesmo, renderiza manualmente para garantir que a interface atualiza
        render();
      }
    }

    /* =========================================================
       3. UTILITÁRIOS
       ========================================================= */
    const $ = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

    const getParty = (id) => PARTIES.find((p) => p.id === id);

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    /** Cor de texto (preto ou branco) legível sobre a cor `hex` do partido. */
    function textOn(hex) {
      const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255)
        .map((c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
      const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      return (lum + 0.05) / 0.05 > 1.05 / (lum + 0.05) ? '#111' : '#fff';
    }

    const normalize = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

    /* =========================================================
       4. CONVERGÊNCIAS (Fase 3) E AFINIDADES (Fase 4)
       ========================================================= */

    /**
     * Devolve os outros partidos com um tópico semelhante a `topic`
     * na mesma categoria. Fase 3: comparar o campo `ideia`.
     * @returns {Array<object>} partidos convergentes
     */
    function getConvergences(partyId, categoryId, topic) {
      if (!topic?.ideia) return [];
      return (getIdeaIndex().get(`${categoryId}|${topic.ideia}`) || []).filter((p) => p.id !== partyId);
    }

    /** Índice "categoria|ideia" → partidos, construído uma vez na primeira consulta. */
    let ideaIndex = null;
    function getIdeaIndex() {
      if (ideaIndex) return ideaIndex;
      ideaIndex = new Map();
      for (const party of PARTIES) {
        for (const [categoryId, topics] of Object.entries(party.programa)) {
          for (const { ideia } of topics) {
            if (!ideia) continue;
            const key = `${categoryId}|${ideia}`;
            if (!ideaIndex.has(key)) ideaIndex.set(key, []);
            ideaIndex.get(key).push(party);
          }
        }
      }
      return ideaIndex;
    }

    /**
     * Constrói o mapa completo, ao estilo Obsidian, com três tipos de nó:
     *   partido   → os 9 partidos
     *   categoria → as 15 categorias
     *   ideia     → cada proposta; propostas com a mesma `ideia` na mesma
     *               categoria partilham o nó, ligando os partidos através dele.
     * Ligações: partido → ideia e ideia → categoria.
     * @returns {{ nodes: Array, edges: Array }}
     */
    function buildAffinityGraph() {
      const shorten = (s, max = 48) => (s.length > max ? `${s.slice(0, max - 1).trimEnd()}…` : s);
      const nodes = [];
      const edges = [];
      const ideas = new Map(); // "categoria|ideia" → nó da ideia
      const ideasPerCategory = new Map(CATEGORIES.map((c) => [c.id, 0]));

      for (const party of PARTIES) {
        let total = 0;
        for (const category of CATEGORIES) {
          (party.programa[category.id] || []).forEach((topic, i) => {
            total++;
            const key = `${category.id}|${topic.ideia || `${party.id}-${i}`}`;
            let idea = ideas.get(key);
            if (!idea) {
              idea = { id: `i:${key}`, group: 'ideia', label: shorten(topic.texto), categoria: category.nome, parties: [] };
              ideas.set(key, idea);
              ideasPerCategory.set(category.id, ideasPerCategory.get(category.id) + 1);
              edges.push({ from: idea.id, to: `c:${category.id}`, group: 'categoria' });
            }
            if (idea.parties.some((p) => p.party === party)) return;
            idea.parties.push({ party, texto: topic.texto });
            edges.push({ from: `p:${party.id}`, to: idea.id, group: 'partido', cor: party.cor });
          });
        }
        nodes.push({
          id: `p:${party.id}`,
          group: 'partido',
          label: party.sigla,
          cor: party.cor,
          title: `${party.nome}\n${total} propostas. Clica para abrir o programa.`,
        });
      }

      for (const category of CATEGORIES) {
        const n = ideasPerCategory.get(category.id);
        nodes.push({ id: `c:${category.id}`, group: 'categoria', label: category.nome, title: `${category.nome}\n${n} ${n === 1 ? 'ideia' : 'ideias'}` });
      }

      for (const idea of ideas.values()) {
        const shared = idea.parties.length > 1;
        nodes.push({
          ...idea,
          shared,
          title: `${idea.categoria}${shared ? ` · ideia partilhada por ${idea.parties.length} partidos` : ''}\n`
            + idea.parties.map(({ party, texto }) => `${party.sigla}: ${texto}`).join('\n'),
        });
      }

      return { nodes, edges };
    }

    let network = null;

    function destroyGraph() {
      network?.destroy();
      network = null;
    }

    /** "#rrggbb" → "rgba(r, g, b, a)" */
    const withAlpha = (hex, a) => `rgba(${[1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16)).join(', ')}, ${a})`;

    const GRAPH_FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
    const IDEA_FONT = 12;
    const NODE_SHADOW = { enabled: true, color: 'rgba(0, 0, 0, 0.2)', size: 10, x: 0, y: 3 };

    /** Cores do mapa que dependem do tema claro/escuro. */
    function graphTheme() {
      const dark = matchMedia('(prefers-color-scheme: dark)').matches;
      return dark
        ? { categoryBg: '#2a323e', categoryBorder: '#4b5563', categoryHover: '#343e4c', categoryText: '#d5dae1',
            labelText: '#e7eaee', labelStroke: '#1a2029', neutral: '160, 170, 185' }
        : { categoryBg: '#eef1f5', categoryBorder: '#a3abb7', categoryHover: '#e2e6ec', categoryText: '#3b4450',
            labelText: '#3b4450', labelStroke: '#ffffff', neutral: '120, 130, 145' };
    }

    /** Estilo Vis.js de cada tipo de nó. */
    function styleNode({ group, cor, shared, parties, categoria, ...n }, theme) {
      if (group === 'partido') {
        return {
          ...n,
          shape: 'box',
          mass: 3,
          shadow: NODE_SHADOW,
          margin: { top: 16, right: 22, bottom: 16, left: 22 },
          borderWidth: 2,
          shapeProperties: { borderRadius: 10 },
          color: { background: cor, border: cor, highlight: { background: cor, border: '#1b1f24' }, hover: { background: cor, border: '#1b1f24' } },
          font: { color: textOn(cor), size: 20, face: GRAPH_FONT },
        };
      }
      if (group === 'categoria') {
        return {
          ...n,
          shape: 'ellipse',
          mass: 2,
          shadow: NODE_SHADOW,
          borderWidth: 1,
          color: {
            background: theme.categoryBg,
            border: theme.categoryBorder,
            highlight: { background: theme.categoryHover, border: theme.categoryText },
            hover: { background: theme.categoryHover, border: theme.categoryText },
          },
          font: { color: theme.categoryText, size: 14, face: GRAPH_FONT },
        };
      }
      const [fill, border] = shared ? ['#2fb488', '#1c8a66'] : ['#6b98f0', '#4a7bd8'];
      return {
        ...n,
        shape: 'dot',
        size: shared ? 4 + 1.5 * parties.length : 4,
        borderWidth: 0.5,
        borderWidthSelected: 1.5,
        color: { background: fill, border, highlight: { background: fill, border: theme.labelText }, hover: { background: fill, border: theme.labelText } },
        // Rótulo só desenhado quando o texto no ecrã tiver pelo menos 10px, ou seja, com zoom.
        font: { color: theme.labelText, size: IDEA_FONT, face: GRAPH_FONT, strokeWidth: 3, strokeColor: theme.labelStroke },
        scaling: { label: { drawThreshold: 10 } },
      };
    }

    function styleEdge({ group, cor, ...e }, theme) {
      return group === 'partido'
        ? { ...e, width: 1, color: { color: withAlpha(cor, 0.3), hover: withAlpha(cor, 0.95), highlight: cor } }
        : { ...e, width: 0.5, color: { color: `rgba(${theme.neutral}, 0.15)`, hover: `rgba(${theme.neutral}, 0.8)`, highlight: `rgba(${theme.neutral}, 0.9)` } };
    }

    /** Inicializa o mapa Vis.js dentro de `container`. */
    function initGraph(container) {
      destroyGraph();
      if (!container) return;
      if (typeof vis === 'undefined') {
        container.innerHTML = '<div class="empty-state"><p>Não foi possível carregar a biblioteca do grafo (Vis.js). Verifica a ligação à Internet e recarrega a página.</p></div>';
        return;
      }

      const { nodes, edges } = buildAffinityGraph();
      const theme = graphTheme();
      const nodeSet = new vis.DataSet(nodes.map((n) => styleNode(n, theme)));
      const edgeSet = new vis.DataSet(edges.map((e) => styleEdge(e, theme)));

      const options = {
        layout: { improvedLayout: false }, // o layout inicial "melhorado" é muito lento com centenas de nós
        // Ao passar o rato (ou selecionar) as linhas ficam mais espessas e opacas.
        edges: { smooth: { type: 'continuous' }, hoverWidth: (w) => w + 1.5, selectionWidth: (w) => w + 1.5 },
        physics: {
          enabled: true,
          solver: 'forceAtlas2Based',
          forceAtlas2Based: { gravitationalConstant: -150, centralGravity: 0.008, springLength: 70, springConstant: 0.05, damping: 0.5, avoidOverlap: 0.2 },
          minVelocity: 1,
          stabilization: { enabled: true, iterations: 1000, updateInterval: 25 },
        },
        interaction: { hover: true, tooltipDelay: 120, dragNodes: true, dragView: true, zoomView: true },
      };

      network = new vis.Network(container, { nodes: nodeSet, edges: edgeSet }, options);

      // Indicador enquanto a física organiza centenas de nós (depois do Network, que limpa o container).
      const loading = document.createElement('div');
      loading.className = 'graph-loading';
      loading.setAttribute('role', 'status');
      loading.innerHTML = '<span>A organizar o mapa…</span><progress max="100" value="0"></progress>';
      container.appendChild(loading);

      network.on('stabilizationProgress', ({ iterations, total }) => {
        loading.querySelector('progress').value = Math.round((iterations / total) * 100);
      });

      // Partidos e categorias mantêm um rótulo legível mesmo com o mapa todo à vista.
      const narrow = container.clientWidth < 600;
      const fixedLabels = nodes.filter((n) => n.group !== 'ideia')
        .map((n) => ({ id: n.id, px: n.group === 'partido' ? (narrow ? 15 : 20) : (narrow ? 10 : 14) }));
      const keepLabelsReadable = () => {
        const scale = network.getScale();
        nodeSet.update(fixedLabels.map(({ id, px }) => ({ id, font: { size: Math.max(px, px / scale) } })));
      };
      network.on('zoom', keepLabelsReadable);
      network.once('stabilizationIterationsDone', () => {
        // Com 500+ nós a física nunca acalma por completo: desliga-se para parar o tremor.
        // Os nós ficam fixos, mas continuam a poder ser arrastados (dragNodes).
        network.setOptions({ physics: { enabled: false } });
        // Os rótulos crescem depois do primeiro enquadramento, por isso enquadra-se duas vezes.
        for (let i = 0; i < 2; i++) {
          network.fit();
          keepLabelsReadable();
        }
        loading.remove();
      });

      // Ao passar o rato, o rótulo da ideia cresce o suficiente para se ler a qualquer zoom.
      network.on('hoverNode', ({ node }) => {
        container.style.cursor = node.startsWith('p:') ? 'pointer' : '';
        if (node.startsWith('i:')) nodeSet.update({ id: node, font: { size: Math.max(IDEA_FONT, 13 / network.getScale()) } });
      });
      network.on('blurNode', ({ node }) => {
        container.style.cursor = '';
        if (node.startsWith('i:')) nodeSet.update({ id: node, font: { size: IDEA_FONT } });
      });

      // Clicar num partido abre o seu programa.
      network.on('click', ({ nodes: [nodeId] }) => {
        if (!nodeId?.startsWith('p:')) return;
        state.category = 'todas';
        navigate(`#/partido/${nodeId.slice(2)}/programa`);
      });
    }

    /* =========================================================
       5. RENDERIZAÇÃO
       ========================================================= */
    let lastRoute = null;
    // O render corre no hashchange (assíncrono): o que depende do novo DOM espera por ele aqui.
    const afterRender = [];

    function render() {
      // Na vista do grafo mantém-se o último partido, para o botão "Partidos" lá voltar.
      Object.assign(state, parseHash());
      renderViewSwitch();
      renderPartyList();

      const view = $('#view');
      if (state.view === 'grafo') view.innerHTML = renderGraphView();
      else if (state.partyId) view.innerHTML = renderPartyView(getParty(state.partyId));
      else view.innerHTML = renderWelcome();

      if (state.view === 'grafo') initGraph($('#graph'));
      else destroyGraph();

      const route = location.hash;
      if (route !== lastRoute) $('#main').scrollTop = 0;
      lastRoute = route;

      afterRender.splice(0).forEach((fn) => fn());
    }

    function renderViewSwitch() {
      $$('.view-switch [data-view]').forEach((btn) => {
        btn.setAttribute('aria-pressed', String(btn.dataset.view === state.view));
      });
    }

    function renderPartyList() {
      const q = normalize(state.search);
      const items = PARTIES.filter((p) => !q || normalize(`${p.sigla} ${p.nome}`).includes(q));

      $('#party-list').innerHTML = items.length
        ? items.map((p) => `
          <li>
            <button class="party-item" type="button" data-party="${p.id}"
                    aria-current="${state.view === 'partidos' && p.id === state.partyId}" style="--party-color:${p.cor}">
              <span class="party-logo" aria-hidden="true">${escapeHtml(p.sigla)}</span>
              <span class="party-meta">
                <strong>${escapeHtml(p.sigla)}</strong>
                <span>${escapeHtml(p.nome)}</span>
              </span>
            </button>
          </li>`).join('')
        : '<li class="placeholder">Nenhum partido encontrado.</li>';
    }

    function renderWelcome() {
      return `
        <section class="empty-state">
          <h2>Bem-vindo ao Mapa Político de Portugal</h2>
          <p>Escolhe um partido no painel para explorar o programa eleitoral por categoria e conhecer os seus dirigentes, ou abre o grafo para ver as afinidades entre partidos.</p>
        </section>`;
    }

    function renderPartyView(party) {
      const tabs = [
        { id: 'programa', label: 'Programa' },
        { id: 'quem', label: 'Quem é Quem' },
      ];

      return `
        <header class="party-header" style="--party-color:${party.cor}">
          <span class="party-logo" aria-hidden="true">${escapeHtml(party.sigla)}</span>
          <div>
            <h2>${escapeHtml(party.sigla)}</h2>
            <p>${escapeHtml(party.nome)}</p>
          </div>
        </header>

        <div class="tabs" role="tablist" aria-label="Secções do partido">
          ${tabs.map((t) => `
            <button class="tab" type="button" role="tab" id="tab-${t.id}"
                    aria-controls="panel-${t.id}" aria-selected="${t.id === state.tab}"
                    tabindex="${t.id === state.tab ? 0 : -1}" data-tab="${t.id}">${t.label}</button>`).join('')}
        </div>

        ${tabs.map((t) => `
          <section class="tab-panel" role="tabpanel" id="panel-${t.id}"
                   aria-labelledby="tab-${t.id}" ${t.id === state.tab ? '' : 'hidden'}>
            ${t.id === 'programa' ? renderProgram(party) : renderPeople(party)}
          </section>`).join('')}`;
    }

    function renderProgram(party) {
      const chips = [{ id: 'todas', nome: 'Todas' }, ...CATEGORIES].map((c) => `
        <button class="chip" type="button" data-category="${c.id}"
                aria-pressed="${c.id === state.category}">${escapeHtml(c.nome)}</button>`).join('');

      const visible = CATEGORIES.filter((c) => state.category === 'todas' || c.id === state.category);

      return `
        ${party.fonte ? `<p class="source-note">Fonte: ${escapeHtml(party.fonte)}</p>` : ''}
        <div class="chips" role="group" aria-label="Filtrar por categoria">${chips}</div>
        <div class="category-list">
          ${visible.map((c) => renderCategory(party, c, visible.length === 1)).join('')}
        </div>`;
    }

    function renderCategory(party, category, open) {
      const topics = party.programa[category.id] || [];
      const filled = Object.keys(party.programa).length > 0;
      const body = topics.length
        ? `<ul class="topic-list">${topics.map((t) => renderTopic(party, category, t)).join('')}</ul>`
        : `<p class="placeholder category-empty">${filled ? UNAVAILABLE + '.' : 'Propostas por preencher.'}</p>`;

      return `
        <details class="category" ${open ? 'open' : ''}>
          <summary>
            <span>${escapeHtml(category.nome)}</span>
            <span class="category-count">${topics.length}</span>
          </summary>
          ${body}
        </details>`;
    }

    function renderTopic(party, category, topic) {
      const badges = getConvergences(party.id, category.id, topic).map((p) => `
        <button class="badge" type="button" data-party="${p.id}" data-goto-category="${category.id}"
                data-goto-ideia="${escapeHtml(topic.ideia)}"
                style="--party-color:${p.cor};--badge-text:${textOn(p.cor)}"
                title="${escapeHtml(p.nome)} partilha esta ideia"
                aria-label="Ver a proposta do ${escapeHtml(p.nome)}">${escapeHtml(p.sigla)}</button>`).join('');

      return `
        <li class="topic" data-ideia="${escapeHtml(topic.ideia || '')}">
          <span class="topic-text">${escapeHtml(topic.texto)}</span>
          ${badges ? `<span class="badges" aria-label="Partidos com ideia semelhante">${badges}</span>` : ''}
        </li>`;
    }

    function renderPeople(party) {
      if (!party.dirigentes.length) {
        return '<p class="placeholder">Dirigentes por preencher.</p>';
      }
      const field = (label, value) => `<div><dt>${label}</dt><dd>${escapeHtml(value || UNAVAILABLE)}</dd></div>`;

      return `
        <div class="people-grid">
          ${party.dirigentes.map((d) => `
            <article class="person-card">
              <h3>${escapeHtml(d.nome)}</h3>
              <p class="person-role">${escapeHtml(d.funcao || UNAVAILABLE)}</p>
              <dl class="person-fields">
                ${field('Área de destaque', d.area)}
                ${field('Tempo de militância', d.militancia)}
                ${field('Passado político', d.passado)}
              </dl>
            </article>`).join('')}
        </div>`;
    }

    function renderGraphView() {
      const { nodes } = buildAffinityGraph();
      const count = (fn) => nodes.filter(fn).length;
      const ideas = count((n) => n.group === 'ideia');
      const shared = count((n) => n.shared);
      const item = (cls, text) => `<span class="legend-item"><i class="legend-mark ${cls}"></i>${text}</span>`;

      return `
        <section class="graph-view">
          <h2>Mapa de afinidades</h2>
          <p>Um mapa complexo, ao estilo Obsidian, que liga os ${count((n) => n.group === 'partido')} partidos, as ${count((n) => n.group === 'categoria')} categorias e as ${ideas} propostas dos programas. Cada partido liga-se às suas propostas e cada proposta à sua categoria. Quando dois ou mais partidos defendem a mesma ideia, ficam ligados através dela (${shared} ideias partilhadas).</p>
          <p>Faz zoom para ler as propostas, passa o rato por um nó para ver os detalhes, arrasta os nós para explorar a teia e clica num partido para abrir o programa.</p>
          <div class="graph-legend">
            ${item('is-party', 'Partido')}
            ${item('is-category', 'Categoria')}
            ${item('is-idea', 'Proposta de um partido')}
            ${item('is-shared', 'Ideia partilhada (maior com mais partidos)')}
          </div>
          <div class="graph-canvas" id="graph"></div>
        </section>`;
    }

    /* =========================================================
       6. EVENTOS
       ========================================================= */
    function setSidebar(open) {
      $('#sidebar').classList.toggle('is-open', open);
      $('.backdrop').classList.toggle('is-visible', open);
      $('.menu-btn').setAttribute('aria-expanded', String(open));
      if (open) $('#party-search').focus();
    }

    function bindEvents() {
      document.addEventListener('click', (e) => {
        const el = e.target.closest('[data-party], [data-tab], [data-category], [data-view], [data-action]');
        if (!el) return;
        const { party, tab, category, view, action } = el.dataset;

        if (party) {
          // Um badge abre o outro partido já filtrado na mesma categoria, com a ideia destacada.
          const { gotoCategory, gotoIdeia } = el.dataset;
          state.category = gotoCategory || 'todas';
          setSidebar(false);
          afterRender.push(() => {
            $('.chip[aria-pressed="true"]')?.scrollIntoView({ block: 'nearest', inline: 'center' });
            if (!gotoIdeia) return;
            const target = $(`.topic[data-ideia="${CSS.escape(gotoIdeia)}"]`);
            target?.classList.add('is-highlight');
            target?.scrollIntoView({ block: 'center' });
            target?.querySelector('.badge')?.focus({ preventScroll: true });
          });
          navigate(`#/partido/${party}/programa`);
        } else if (tab) {
          afterRender.push(() => $(`#tab-${tab}`)?.focus());
          navigate(`#/partido/${state.partyId}/${tab}`);
        } else if (category) {
          state.category = category;
          render();
          $(`[data-category="${category}"]`)?.scrollIntoView({ block: 'nearest', inline: 'center' });
        } else if (view) {
          navigate(view === 'grafo' ? '#/grafo' : (state.partyId ? `#/partido/${state.partyId}/${state.tab}` : '#/'));
        } else if (action === 'open-sidebar') {
          setSidebar(true);
        } else if (action === 'close-sidebar') {
          setSidebar(false);
        }
      });

      // Navegação das abas com as setas (padrão WAI-ARIA)
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') setSidebar(false);
        const tab = e.target.closest('[role="tab"]');
        if (!tab || !['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
        const tabs = $$('[role="tab"]');
        const next = tabs[(tabs.indexOf(tab) + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
        next.click();
      });

      $('#party-search').addEventListener('input', (e) => {
        state.search = e.target.value;
        renderPartyList();
      });

      window.addEventListener('hashchange', render);
    }

    /* =========================================================
       7. ARRANQUE
       ========================================================= */
    bindEvents();
    render();
  </script>
</body>
</html>
