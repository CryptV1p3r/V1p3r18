    /* ---------- Partilha e aviso (toast) ---------- */
    let toastTimer;

    function toast(message) {
      let el = $('.toast');
      if (!el) {
        el = document.createElement('div');
        el.className = 'toast';
        el.setAttribute('role', 'status');
        document.body.appendChild(el);
      }
      el.textContent = message;
      // Força o reflow para a animação recomeçar quando há dois avisos seguidos.
      el.classList.remove('is-visible');
      void el.offsetWidth;
      el.classList.add('is-visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('is-visible'), 2600);
    }

    /** Copia o link da vista atual; sem acesso à API Clipboard, tenta o método antigo. */
    async function shareLink() {
      const url = window.location.href;
      try {
        await navigator.clipboard.writeText(url);
      } catch {
        const area = document.createElement('textarea');
        area.value = url;
        area.setAttribute('readonly', '');
        area.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(area);
        area.select();
        const ok = document.execCommand('copy');
        area.remove();
        if (!ok) { toast('Não foi possível copiar o link.'); return; }
      }
      toast('Link copiado para a área de transferência!');
    }

    const SHARE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>';
    const PRINT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></svg>';
    const shareButton = () => `<button class="action-btn" type="button" data-action="share">${SHARE_ICON}<span>Partilhar</span></button>`;

    /* ---------- Impressão / PDF ---------- */
    // Abre todas as categorias para imprimir e repõe o estado a seguir (também com Ctrl+P).
    let printClosed = [];
    window.addEventListener('beforeprint', () => {
      printClosed = $$('details.category:not([open])');
      printClosed.forEach((d) => { d.open = true; });
    });
    window.addEventListener('afterprint', () => {
      printClosed.forEach((d) => { d.open = false; });
      printClosed = [];
    });

    function printProgram() {
      // Imprime o programa completo, mesmo que haja um filtro de categoria ativo.
      if (state.tab === 'programa' && state.category !== 'todas') {
        state.category = 'todas';
        render();
      }
      window.print();
    }

    /* =========================================================
       5. RENDERIZAÇÃO
       ========================================================= */
    let lastRoute = null;
    let lastView = null;
    // O render corre no hashchange (assíncrono): o que depende do novo DOM espera por ele aqui.
    const afterRender = [];

    function render() {
      // Na vista do grafo mantém-se o último partido, para o botão "Partidos" lá voltar.
      Object.assign(state, parseHash());
      // Na página inicial o painel lateral desaparece e os cartões ocupam o espaço todo.
      $('.app').classList.toggle('is-home', state.view === 'partidos' && !state.partyId);
      // Ao entrar na Bússola baralham-se novas perguntas.
      if (state.view === 'bussola' && (lastView !== 'bussola' || !state.quizIds.length)) newQuizRound();
      lastView = state.view;
      closeModal();
      renderViewSwitch();
      renderPartyList();

      const view = $('#view');
      if (state.view === 'grafo') view.innerHTML = renderGraphView();
      else if (state.view === 'duelo') view.innerHTML = renderDuelView();
      else if (state.view === 'bussola') view.innerHTML = renderQuizView();
      else if (state.partyId) view.innerHTML = renderPartyView(getParty(state.partyId));
      else view.innerHTML = renderHome();

      if (state.view === 'grafo') initGraph($('#graph'));
      else destroyGraph();

      const route = location.hash;
      if (route !== lastRoute) $('#main').scrollTop = 0;
      lastRoute = route;

      afterRender.splice(0).forEach((fn) => fn());
    }

    function renderViewSwitch() {
      $$('.view-switch [data-view]').forEach((btn) => {
        btn.setAttribute('aria-pressed', String(btn.dataset.view === state.view));
      });
    }

    function renderPartyList() {

      const items = PARTIES.filter((p) => !q || normalize(`${p.sigla} ${p.nome}`).includes(q));

      $('#party-list').innerHTML = items.length
        ? items.map((p) => `
          <li>
            <button class="party-item" type="button" data-party="${p.id}"
                    aria-current="${state.view === 'partidos' && p.id === state.partyId}" style="--party-color:${p.cor}">

                <strong>${escapeHtml(p.sigla)}</strong>
                <span>${escapeHtml(p.nome)}</span>
              </span>
            </button>
          </li>`).join('')
        : '<li class="placeholder">Nenhum partido encontrado.</li>';
    }

    function renderHome() {
      const cards = PARTIES.map((p) => {

          </li>`;
      }).join('');
      return `
        <section class="home">
          <div class="home-hero">
            <h2>Escolhe um partido</h2>
            <p>Explora os programas eleitorais dos partidos, categoria a categoria, com base nos documentos oficiais, ou compara-os no grafo e no duelo.</p>

        <div class="tabs" role="tablist" aria-label="Secções do partido">

    function renderProgram(party) {
      const chips = [{ id: 'todas', nome: 'Todas' }, ...CATEGORIES].map((c) => `
        <button class="chip" type="button" data-category="${c.id}"
                aria-pressed="${c.id === state.category}">${escapeHtml(c.nome)}</button>`).join('');

      const visible = CATEGORIES.filter((c) => state.category === 'todas' || c.id === state.category);

      return `
        ${party.fonte ? `<p class="source-note">Fonte: ${escapeHtml(party.fonte)}</p>` : ''}
        <div class="chips" role="group" aria-label="Filtrar por categoria">${chips}</div>
        <div class="category-list">
          ${visible.map((c) => renderCategory(party, c, visible.length === 1)).join('')}
        </div>`;
    }

    function renderCategory(party, category, open) {
      const topics = party.programa[category.id] || [];
      const filled = Object.keys(party.programa).length > 0;
      const body = topics.length
        ? `<ul class="topic-list">${topics.map((t) => renderTopic(party, category, t)).join('')}</ul>`
        : `<p class="placeholder category-empty">${filled ? UNAVAILABLE + '.' : 'Propostas por preencher.'}</p>`;

      return `
        <details class="category" ${open ? 'open' : ''}>
          <summary>
            <span>${escapeHtml(category.nome)}</span>
            <span class="category-count">${topics.length}</span>
          </summary>
          ${body}
        </details>`;
    }

    function renderTopic(party, category, topic) {
      const badges = getConvergences(party.id, category.id, topic).map((p) => `
        <button class="badge" type="button" data-party="${p.id}" data-goto-category="${category.id}"
                data-goto-ideia="${escapeHtml(topic.ideia)}"
                style="--party-color:${p.cor};--badge-text:${textOn(p.cor)}"
                title="${escapeHtml(p.nome)} partilha esta ideia"
                aria-label="Ver a proposta do ${escapeHtml(p.nome)}">${escapeHtml(p.sigla)}</button>`).join('');

      return `
        <li class="topic" data-ideia="${escapeHtml(topic.ideia || '')}">
          <span class="topic-text">${escapeHtml(topic.texto)}</span>
          ${badges ? `<span class="badges" aria-label="Partidos com ideia semelhante">${badges}</span>` : ''}
        </li>`;
    }

    function renderPeople(party) {
      if (!party.dirigentes.length) {
        return '<p class="placeholder">Dirigentes por preencher.</p>';
      }
      const field = (label, value) => `<div><dt>${label}</dt><dd>${escapeHtml(value || UNAVAILABLE)}</dd></div>`;

      return `
        <div class="people-grid">
          ${party.dirigentes.map((d) => `
            <article class="person-card">
              <h3>${escapeHtml(d.nome)}</h3>
              <p class="person-role">${escapeHtml(d.funcao || UNAVAILABLE)}</p>
              <dl class="person-fields">
                ${field('Área de destaque', d.area)}
                ${field('Tempo de militância', d.militancia)}
                ${field('Passado político', d.passado)}
              </dl>
            </article>`).join('')}
        </div>`;
    }

    function renderGraphView() {
      const { nodes } = buildAffinityGraph();
      const count = (fn) => nodes.filter(fn).length;
      const ideas = count((n) => n.group === 'ideia');
      const shared = count((n) => n.shared);
      const item = (cls, text) => `<span class="legend-item"><i class="legend-mark ${cls}"></i>${text}</span>`;
      const options = CATEGORIES.map((c) => `
            <option value="${c.id}" ${c.id === state.graphCategory ? 'selected' : ''}>${escapeHtml(c.nome)}</option>`).join('');

      return `
        <section class="graph-view">
          <div class="view-head">
            <h2>Mapa de afinidades</h2>
            ${shareButton()}
          </div>
          <p>Um mapa complexo, ao estilo Obsidian, que liga os ${count((n) => n.group === 'partido')} partidos, as ${count((n) => n.group === 'categoria')} categorias e as ${ideas} propostas dos programas. Cada partido liga-se às suas propostas e cada proposta à sua categoria. Quando dois ou mais partidos defendem a mesma ideia, ficam ligados através dela (${shared} ideias partilhadas).</p>
          <p>Pesquisa um partido, uma categoria ou uma proposta, filtra por categoria para limpar o mapa, passa o rato por um partido para destacar as suas ligações e clica nele para abrir o programa.</p>
          <div class="graph-toolbar">
            <label class="graph-search">
              <span class="visually-hidden">Pesquisar no mapa</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
              <input id="graph-search" type="search" placeholder="Pesquisar partido, categoria ou proposta…" autocomplete="off">
            </label>
            <label class="graph-filter">
              <span class="visually-hidden">Filtrar por categoria</span>
              <select id="graph-category">
                <option value="">Todas as categorias</option>${options}
              </select>
            </label>
            <span class="graph-status" id="graph-status" aria-live="polite"></span>
          </div>
          <div class="graph-legend">
            ${item('is-party', 'Partido')}
            ${item('is-category', 'Categoria')}
            ${item('is-idea', 'Proposta de um partido')}
            ${item('is-shared', 'Ideia partilhada (maior com mais partidos)')}
          </div>
          <div class="graph-canvas" id="graph"></div>
        </section>`;
    }

    /* =========================================================
       6. EVENTOS
       ========================================================= */
    /* ---------- Tema claro/escuro ---------- */
    const THEME_KEY = 'mapa-politico:tema';

    /** Tema em uso: o forçado pelo utilizador ou, se nenhum, o do sistema. */
    function currentTheme() {
      return document.documentElement.dataset.theme
        || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    }

    function renderThemeButton() {
      const dark = currentTheme() === 'dark';
      const btn = $('.theme-btn');
      btn.setAttribute('aria-label', dark ? 'Mudar para o tema claro' : 'Mudar para o tema escuro');
      btn.title = btn.getAttribute('aria-label');
      $('[data-icon="sun"]', btn).hidden = !dark;
      $('[data-icon="moon"]', btn).hidden = dark;
    }

    function toggleTheme() {
      const next = currentTheme() === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem(THEME_KEY, next); } catch { /* sem armazenamento: vale só nesta visita */ }
      renderThemeButton();
      graphRetheme?.();
    }

    function setSidebar(open) {
      $('#sidebar').classList.toggle('is-open', open);
      $('.backdrop').classList.toggle('is-visible', open);
      $('.menu-btn').setAttribute('aria-expanded', String(open));
      if (open) $('#party-search').focus();
    }

    function bindEvents() {
      document.addEventListener('click', (e) => {
        const el = e.target.closest('[data-party], [data-tab], [data-category], [data-view], [data-action]');
        if (!el) return;
        const { party, tab, category, view, action } = el.dataset;

        if (party) {
          // Um badge abre o outro partido já filtrado na mesma categoria, com a ideia destacada.
          const { gotoCategory, gotoIdeia } = el.dataset;
          state.category = gotoCategory || 'todas';
          setSidebar(false);
          closeModal();
          closeSearch();
          afterRender.push(() => {
            $('.chip[aria-pressed="true"]')?.scrollIntoView({ block: 'nearest', inline: 'center' });
            if (!gotoIdeia) return;
            const target = $(`.topic[data-ideia="${CSS.escape(gotoIdeia)}"]`);
            target?.classList.add('is-highlight');
            target?.scrollIntoView({ block: 'center' });
            target?.querySelector('.badge')?.focus({ preventScroll: true });
          });
          navigate(`#/partido/${party}/${el.dataset.gotoTab === 'quem' ? 'quem' : 'programa'}`);
        } else if (tab) {
          afterRender.push(() => $(`#tab-${tab}`)?.focus());
          navigate(`#/partido/${state.partyId}/${tab}`);
        } else if (category) {
          state.category = category;
          render();
          $(`[data-category="${category}"]`)?.scrollIntoView({ block: 'nearest', inline: 'center' });
        } else if (view) {
          if (view === 'grafo') navigate(state.graphCategory ? `#/grafo/${state.graphCategory}` : '#/grafo');
          else if (view === 'bussola') navigate('#/bussola');
          else if (view === 'duelo') navigate(`#/duelo/${state.duelA}/${state.duelB}`);
          else navigate(state.partyId ? `#/partido/${state.partyId}/${state.tab}` : '#/');
        } else if (action === 'share') {
          shareLink();
        } else if (action === 'print') {
          printProgram();
        } else if (action === 'quiz-reset') {
          newQuizRound();
          render();
          $('#main').scrollTo({ top: 0, behavior: 'smooth' });
        } else if (action === 'home') {
          navigate('#/');
        } else if (action === 'toggle-theme') {
          toggleTheme();
        } else if (action === 'open-sidebar') {
          setSidebar(true);
        } else if (action === 'close-sidebar') {
          setSidebar(false);
        }
      });

      // Navegação das abas com as setas (padrão WAI-ARIA)
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { setSidebar(false); closeModal(); }
        const tab = e.target.closest('[role="tab"]');
        if (!tab || !['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
        const tabs = $$('[role="tab"]');
        const next = tabs[(tabs.indexOf(tab) + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
        next.click();
      });

      $('#party-search').addEventListener('input', (e) => {
        state.search = e.target.value;
        renderPartyList();
      });

      // Pesquisa e filtro do grafo (delegados: a vista é recriada a cada render).
      let searchTimer;
      document.addEventListener('input', (e) => {
        if (e.target.id !== 'graph-search') return;
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => graphSearch?.(e.target.value), 200);
      });
      document.addEventListener('keydown', (e) => {
        if (e.target.id !== 'graph-search' || e.key !== 'Enter') return;
        e.preventDefault();
        clearTimeout(searchTimer);
        graphSearch?.(e.target.value, true);
      });
      document.addEventListener('change', (e) => {
        const side = e.target.dataset.duel;
        if (side) {
          const [a, b] = side === 'A' ? [e.target.value, state.duelB] : [state.duelA, e.target.value];
          navigate(`#/duelo/${a}/${b}`);
          return;
        }
        if (e.target.dataset.quiz) {
          state.quiz[e.target.dataset.quiz] = Number(e.target.value);
          const answered = currentQuiz().filter((q) => state.quiz[q.id] != null).length;
          $('#quiz-progress').textContent = `${answered} de ${state.quizIds.length} respondidas`;
          $('#quiz-submit').disabled = !answered;
          if (state.quizShown) $('#quiz-results').innerHTML = renderQuizResults();
          return;
        }
        if (e.target.id !== 'graph-category') return;
        // O filtro fica no endereço, para o link partilhado abrir o mesmo mapa.
        navigate(e.target.value ? `#/grafo/${e.target.value}` : '#/grafo');
      });

      document.addEventListener('submit', (e) => {
        if (e.target.id !== 'quiz-form') return;
        e.preventDefault();
        state.quizShown = true;
        const results = $('#quiz-results');
        results.innerHTML = renderQuizResults();
        results.hidden = false;
        results.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });

      // Pesquisa global: resultados ao escrever, setas para navegar, Enter para abrir.
      const globalInput = $('#global-search-input');
      globalInput.addEventListener('input', () => renderSearchResults(globalInput.value));
      globalInput.addEventListener('focus', () => { if (globalInput.value) renderSearchResults(globalInput.value); });
      globalInput.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          moveSearchActive(e.key === 'ArrowDown' ? 1 : -1);
        } else if (e.key === 'Enter') {
          e.preventDefault();
          ($$('#global-search-results .search-item')[Math.max(searchActive, 0)])?.click();
        } else if (e.key === 'Escape') {
          closeSearch();
          globalInput.blur();
        }
      });
      document.addEventListener('keydown', (e) => {
        const typing = e.target.closest('input, textarea, select');
        if (((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') || (e.key === '/' && !typing)) {
          if (getComputedStyle($('#global-search')).display === 'none') return;
          e.preventDefault();
          globalInput.focus();
          globalInput.select();
        }
      });
      document.addEventListener('click', (e) => {
        if (!e.target.closest('#global-search')) closeSearch(false);
      });

      window.addEventListener('hashchange', render);
    }

    /* =========================================================
       7. ARRANQUE
       ========================================================= */
    bindEvents();
    renderThemeButton();
    render();
  </script>
</body>
</html>
